services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golfcart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Sätt POSTGRES_PASSWORD i .env}
      POSTGRES_DB: ${POSTGRES_DB:-golfcart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-golfcart} -d ${POSTGRES_DB:-golfcart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-golfcart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-golfcart}
      AUTH_SECRET: ${AUTH_SECRET:?Sätt AUTH_SECRET i .env}
      AUTH_TRUST_HOST: "true"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual-swish}
    ports:
      # Exponera bara lokalt – reverse proxyn (Caddy/nginx) terminerar TLS.
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
